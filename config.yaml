seed: 42
n_splits: 5
num_classes: 16
target_col: AGE_RANGE
id_col: PID
submission_id_col: RowId
anomaly_threshold: 3

age_labels:
  - "15-17"
  - "18-19"
  - "20-24"
  - "25-29"
  - "30-34"
  - "35-39"
  - "40-44"
  - "45-49"
  - "50-54"
  - "55-59"
  - "60-64"
  - "65-69"
  - "70-74"
  - "75-79"
  - "80-84"
  - "85+"

paths:
  train_csv: data/raw/dataset_train.csv
  test_csv: data/raw/dataset_test_X.csv
  example_submission: data/raw/example_submission_10.csv
  processed_dir: data/processed
  out_dir: out
  oof_dir: out/oof
  preds_dir: out/preds
  parts_dir: out/parts
  report_dir: out/report
  figs_dir: out/report/figs
  trials_file: out/trials.json
  submissions_dir: submissions

preprocess:
  drop_cols:
    - PID
    - HHID
    - COUNTRY
    - REFYEAR
    - PROXY
  min_prefix_cols: 3

tune:
  n_trials: 8
  n_folds: 3
  search_seed: 7
  lgb_search_fixed:
    n_estimators: 110
    learning_rate: 0.09
    max_bin: 63
    min_data_per_group: 50
    subsample_freq: 1
    class_weight: balanced
  lgb_final_override:
    n_estimators: 300
    learning_rate: 0.04

models:
  lgb_fe:
    n_estimators: 250
    learning_rate: 0.04
    num_leaves: 15
    colsample_bytree: 0.3
    subsample: 0.8
    subsample_freq: 1
    min_child_samples: 20
    reg_lambda: 1.0
    class_weight: balanced
  lgb_tuned:
    n_estimators: 300
    learning_rate: 0.04
    num_leaves: 7
    colsample_bytree: 0.2
    subsample: 1.0
    subsample_freq: 1
    min_child_samples: 80
    reg_lambda: 0.1
    max_bin: 63
    cat_smooth: 30.0
    min_data_per_group: 50
    class_weight: balanced
  xgb:
    n_estimators: 160
    learning_rate: 0.08
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.3
    min_child_weight: 5
    reg_lambda: 5.0
    tree_method: hist
    max_bin: 64
    objective: multi:softprob
  cat:
    iterations: 250
    learning_rate: 0.12
    depth: 5
    loss_function: MultiClass
    auto_class_weights: Balanced
    rsm: 0.3
    l2_leaf_reg: 5.0
    border_count: 64
  rf:
    n_estimators: 400
    min_samples_leaf: 3
    max_features: 0.2
    class_weight: balanced_subsample
  et:
    n_estimators: 500
    min_samples_leaf: 2
    max_features: 0.25
    class_weight: balanced_subsample
  lr:
    C: 0.02
    max_iter: 300
    class_weight: balanced
  mlp:
    hidden_layer_sizes: [256, 64]
    alpha: 0.03
    early_stopping: true
    validation_fraction: 0.1
    n_iter_no_change: 6
    max_iter: 60
    learning_rate_init: 0.001
  ord:
    n_estimators: 400
    learning_rate: 0.04
    num_leaves: 15
    colsample_bytree: 0.2
    subsample: 0.8
    subsample_freq: 1
    min_child_samples: 40
    reg_lambda: 1.0
    sigma: 1.3

core_models:
  - lgb_fe
  - lgb_tuned
  - xgb
  - cat
  - rf
  - et
  - lr
  - mlp
  - ord

stack:
  c_grid: [0.001, 0.003, 0.01, 0.03]
  max_iter: 1000
  optimize_thresholds: true
  sets:
    base_5: [lgb_tuned, lgb_fe, lr, rf, et]
    plus_xgb_cat: [lgb_tuned, lgb_fe, lr, rf, et, xgb, cat]
    plus_mlp: [lgb_tuned, lgb_fe, lr, rf, et, xgb, cat, mlp]
    all_9: [lgb_tuned, lgb_fe, lr, rf, et, xgb, cat, mlp, ord]
